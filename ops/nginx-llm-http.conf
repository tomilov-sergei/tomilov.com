# Included in nginx's http context. Use exact media ranges before wildcards.
# An empty capture is the implicit q=1. "missing" means the range is absent.
map $http_accept $llm_html_range {
    default missing;
    "~*(?:^|,)[ \t]*text/html[ \t]*(?:;[ \t]*(?!q[ \t]*=)[^,;]*+)*(?:;[ \t]*q[ \t]*=[ \t]*([01](?:\.[0-9]{0,3})?))?[ \t]*(?:,|$)" $1;
}

map $http_accept $llm_markdown_range {
    default missing;
    "~*(?:^|,)[ \t]*text/markdown[ \t]*(?:;[ \t]*(?!q[ \t]*=)[^,;]*+)*(?:;[ \t]*q[ \t]*=[ \t]*([01](?:\.[0-9]{0,3})?))?[ \t]*(?:,|$)" $1;
}

map $http_accept $llm_wildcard_range {
    default 0;
    "" 1;
    "~*(?:^|,)[ \t]*text/\*[ \t]*(?:;[ \t]*q[ \t]*=[ \t]*([01](?:\.[0-9]{0,3})?))?[ \t]*(?:,|$)" $1;
    "~*(?:^|,)[ \t]*\*/\*[ \t]*(?:;[ \t]*q[ \t]*=[ \t]*([01](?:\.[0-9]{0,3})?))?[ \t]*(?:,|$)" $1;
}

map $llm_html_range $llm_html_weight {
    missing $llm_wildcard_range;
    default $llm_html_range;
}

map $llm_markdown_range $llm_markdown_weight {
    missing $llm_wildcard_range;
    default $llm_markdown_range;
}

# Normalize q to four digits so decimal comparisons handle 0.1, 0.10 and 0.100 alike.
map $llm_html_weight $llm_html_q {
    include /etc/nginx/snippets/tomilov-llm-quality.conf;
}

map $llm_markdown_weight $llm_markdown_q {
    include /etc/nginx/snippets/tomilov-llm-quality.conf;
}

map "$llm_markdown_q:$llm_html_q" $llm_markdown_preferred {
    default 0;
    "0000:0000" 0;
    # Match an equal prefix followed by a strictly greater Markdown digit.
    "~^([0-9]*)[1-9][0-9]*:\g{1}0[0-9]*$" 1;
    "~^([0-9]*)[2-9][0-9]*:\g{1}1[0-9]*$" 1;
    "~^([0-9]*)[3-9][0-9]*:\g{1}2[0-9]*$" 1;
    "~^([0-9]*)[4-9][0-9]*:\g{1}3[0-9]*$" 1;
    "~^([0-9]*)[5-9][0-9]*:\g{1}4[0-9]*$" 1;
    "~^([0-9]*)[6-9][0-9]*:\g{1}5[0-9]*$" 1;
    "~^([0-9]*)[7-9][0-9]*:\g{1}6[0-9]*$" 1;
    "~^([0-9]*)[8-9][0-9]*:\g{1}7[0-9]*$" 1;
    "~^([0-9]*)9[0-9]*:\g{1}8[0-9]*$" 1;
    ~^([0-9]+):\1$ 1;
}

map "$llm_available:$llm_markdown_range:$llm_html_q:$llm_markdown_preferred" $llm_format {
    default html;
    ~^yes:[^:]*:0000:0$ reject;
    ~^yes:[^:]*:0000:1$ markdown;
    ~^yes:(?!missing:)[^:]*:[0-9]+:1$ markdown;
}

map $uri $llm_markdown_uri {
    volatile;
    default "";
    / /index.md;
    /index.html /index.md;
    ~^(/[a-zA-Z0-9/-]+)/(?:index\.html)?$ $1.md;
}

map $uri $llm_html_file {
    default $uri;
    ~/$ ${uri}index.html;
}

map $uri $llm_html_uri {
    volatile;
    default "";
    /index.md /;
    ~^(/[a-zA-Z0-9/-]+)\.md$ $1/;
}

log_format tomilov_site '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                        '"$sent_http_content_type"';
