# Direct Markdown routes remain usable regardless of the Accept header.
location ~ ^/(?:index|(?:en|about|barcelona-guide|photos|places|research|screenshots)(?:/[a-zA-Z0-9-]+)*)\.md$ {
    types { text/markdown md; }
    charset utf-8;
    charset_types text/markdown;
    add_header Vary Accept;
    add_header Link "<$llm_html_uri>; rel=\"alternate\"; type=\"text/html\"";
    include /etc/nginx/snippets/tomilov-security-headers.conf;
    try_files $uri =404;
}

# Leave API endpoints, assets, and directory redirects to their existing locations.
location ~ ^/(?:index\.html|(?:(?:en|about|barcelona-guide|photos|places|research|screenshots)(?:/[a-zA-Z0-9-]+)*/)?(?:index\.html)?)$ {
    set $llm_available "";
    set $llm_vary "";
    set $llm_link "";
    if (-f $document_root$llm_markdown_uri) {
        set $llm_available yes;
        set $llm_vary Accept;
        set $llm_link "<$llm_markdown_uri>; rel=\"alternate\"; type=\"text/markdown\"";
    }
    if ($llm_format = reject) {
        return 406;
    }
    if ($llm_format = markdown) {
        rewrite ^ $llm_markdown_uri last;
    }

    add_header Vary $llm_vary always;
    add_header Link $llm_link always;
    include /etc/nginx/snippets/tomilov-security-headers.conf;
    try_files $llm_html_file =404;
}
